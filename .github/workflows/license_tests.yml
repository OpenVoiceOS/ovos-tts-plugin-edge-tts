name: Run License Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [dev]
  workflow_dispatch:

jobs:
  license_tests:
    uses: OpenVoiceOS/gh-automations/.github/workflows/license-check.yml@dev
    secrets: inherit
    with:
      install_extras: ''
      system_deps: ''
      # edge-tts is LGPLv3 (weak copyleft): safe to depend on as a library
      # (dynamic import does not impose copyleft on this plugin's own code).
      exclude_packages: '(?i:^edge-tts([=<>!~ @;].*)?$)'
